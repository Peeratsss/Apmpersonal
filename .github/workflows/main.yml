name: Build APM Overlay

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build APM Overlay
        shell: cmd
        run: |
          cl /nologo /O2 /EHsc APMOverlay.cpp user32.lib gdi32.lib shell32.lib /link /SUBSYSTEM:WINDOWS /OUT:APMOverlay.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: APMOverlay
          path: APMOverlay.exe
